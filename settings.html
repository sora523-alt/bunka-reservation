<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【スタッフ用】店舗設定</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .nav-bar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .refresh-info { font-size: 12px; color: #666; margin-bottom: 15px; }

        /* 🔒 スタッフ認証オーバーレイ（ログインするまで後ろを完全に隠す） */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111111; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-box {
            background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .auth-box input { width: 100%; padding: 12px; font-size: 18px; text-align: center; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .auth-box button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background: #28a745; }
        .auth-box button:hover { background: #218838; }
    </style>
</head>
<body>

<!-- 🔒 スタッフ認証オーバーレイ -->
<div id="auth-overlay" style="display: none;">
    <div class="auth-box">
        <h2 style="color: #0056b3; margin-top: 0;">🔐 スタッフ認証</h2>
        <p style="font-size: 14px; color: #555;">管理画面に入るためのトークン（パスコード）を入力してください。</p>
        <input type="password" id="auth-token-input" placeholder="" autocomplete="off">
        <button id="auth-submit-btn">認証してログイン</button>
        <p id="auth-error-msg" style="color: red; font-size: 13px; margin-top: 10px; display: none;"></p>
    </div>
</div>

<div class="nav-bar" id="app-nav-bar">
    <a href="./staff.html"><button style="background: #007bff;">≪ 現在の管理・運営に戻る</button></a>
    <a href="./history.html"><button style="background: #6c757d;">過去の履歴へ ≫</button></a>
</div>

<h1 id="app-title">【スタッフ用】店舗・タイムスロット設定</h1>
<div id="last-updated" class="refresh-info">最終更新: --:--:--</div>

<div id="settings-container">読み込み中...</div>

<script type="module" src="settings.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBQBgoqHNe06FZIDpGYKSNyTkgo7...",
      authDomain: "reservation-system-5dcbd.firebaseapp.com",
      projectId: "reservation-system-5dcbd",
      storageBucket: "reservation-system-5dcbd.firebasestorage.app",
      messagingSenderId: "601621223185",
      appId: "1:601621223185:web:87cf014b94bf08...",
      measurementId: "G-KL7VR03336"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🛡️ Safariの機能等による設定画面の要素削除やロックすり抜けを防ぎ、全要素とロック画面を完全入れ替え
    async function enforceLockState() {
        const sid = localStorage.getItem("staff_session_uuid");
        if (!sid) return;

        try {
            const docSnap = await getDoc(doc(db, "staff_sessions", sid));
            const navBar = document.getElementById("app-nav-bar");
            const appTitle = document.getElementById("app-title");
            const lastUpdated = document.getElementById("last-updated");
            const settingsContainer = document.getElementById("settings-container");

            if (docSnap.exists() && docSnap.data().isLocked === true) {
                // ロック中のときは通常の操作画面を非表示にする
                if (navBar) navBar.style.display = "none";
                if (appTitle) appTitle.style.display = "none";
                if (lastUpdated) lastUpdated.style.display = "none";
                if (settingsContainer) settingsContainer.style.display = "none";

                let lockDiv = document.getElementById("staff-orange-lock-overlay");
                if (!lockDiv) {
                    lockDiv = document.createElement("div");
                    lockDiv.id = "staff-orange-lock-overlay";
                    lockDiv.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: orange; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 32px; font-weight: bold; text-align: center; padding: 20px; box-sizing: border-box;";
                    lockDiv.innerHTML = `
                        <div>🔒 この端末は管理者によって一時的にロックされています</div>
                        <div style="font-size: 16px; margin-top: 15px; font-weight: normal;">トークン管理画面から解除されるまで操作できません。</div>
                    `;
                    document.body.appendChild(lockDiv);
                } else {
                    lockDiv.style.display = "flex";
                    lockDiv.style.visibility = "visible";
                    lockDiv.style.opacity = "1";
                }
            } else {
                // ロック解除時は通常画面を表示に戻す
                if (navBar) navBar.style.display = "flex";
                if (appTitle) appTitle.style.display = "block";
                if (lastUpdated) lastUpdated.style.display = "block";
                if (settingsContainer) settingsContainer.style.display = "block";

                const lockDiv = document.getElementById("staff-orange-lock-overlay");
                if (lockDiv) lockDiv.remove();
            }
        } catch (e) {
            console.error(e);
        }
    }

    // DOM改変を常時監視
    const observer = new MutationObserver(() => {
        enforceLockState();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class']
    });

    // 定期的にもチェックを実行
    setInterval(enforceLockState, 1000);
</script>
</body>
</html>
