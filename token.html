<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【スタッフ用】管理トークン＆セッション管理</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #0056b3; font-size: 20px; margin-top: 0; }
        .token-display { font-size: 42px; font-weight: bold; color: #28a745; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 2px dashed #28a745; margin: 15px 0; letter-spacing: 4px; }
        .timer { font-size: 16px; color: #dc3545; font-weight: bold; margin-bottom: 10px; }
        .info { font-size: 13px; color: #666; }
        button { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .device-item { background: #fdfdfd; border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .danger-btn { background: #dc3545; padding: 6px 12px; font-size: 12px; }
        .danger-btn:hover { background: #bd2130; }

        /* 🔒 認証オーバーレイ */
        #token-auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-box {
            background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .auth-box input { width: 100%; padding: 12px; font-size: 18px; text-align: center; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .auth-box button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background: #28a745; }
    </style>
</head>
<body>

<!-- 🔒 トークン画面専用のパスワード認証 (20010904) -->
<div id="token-auth-overlay">
    <div class="auth-box">
        <h2 style="color: #0056b3; margin-top: 0;">🔐 管理トークン認証</h2>
        <p style="font-size: 14px; color: #555;">アクセスパスワードを入力してください。</p>
        <input type="password" id="token-password-input" placeholder="パスワード" autocomplete="off">
        <button id="token-submit-btn">認証して開く</button>
        <p id="token-error-msg" style="color: red; font-size: 13px; margin-top: 10px; display: none;"></p>
    </div>
</div>

<div class="card">
    <h1>🔐 スタッフ管理トークン</h1>
    <p class="info">管理画面のログインに必要な5分更新のパスコードです。</p>
    
    <div id="token-box" class="token-display">------</div>
    <div id="countdown-timer" class="timer">次のコードまで: --:--</div>
    
    <a href="./staff.html"><button style="width: 100%; margin-top: 10px;">スタッフ管理画面へ移動</button></a>
</div>

<!-- 🔑 お客様用パスワードの設定カード -->
<div class="card" style="text-align: left;">
    <h1>🔑 お客様用ページパスワード設定</h1>
    <p class="info" style="margin-bottom: 15px;">来場者や生徒が予約画面を開くときに入力する合言葉を変更できます。変更すると、現在ログイン中のお客様は自動的にログアウト（再認証が必要に）されます。</p>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="customer-pass-input" placeholder="新しいパスワード" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
        <button id="save-customer-pass-btn" style="background: #28a745;">パスワード変更</button>
    </div>
</div>

<div class="card" style="text-align: left;">
    <h1>📱 ログイン中端末の管理</h1>
    <p class="info" style="margin-bottom: 15px;">現在アクセスしているスタッフ端末の状況です。不審な端末は強制ログアウトできます。</p>
    <div id="device-list-container">読み込み中...</div>
</div>

<script type="module" src="token.js"></script>
</body>
</html>
